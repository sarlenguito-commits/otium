<!doctype html>
<!-- La muestra GitHub Pages cuando la dirección no existe. Rutas absolutas (/otium/…): se ve desde cualquier lugar. -->
<html lang="es-AR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <title>No está esta página · OTIUM</title>
    <link rel="icon" href="/otium/img/icono-192.png">
    <style>
        :root { --acento: #9c3d1a; --fondo: #f7f4ef; --texto: #1f1b16; --suave: #5f574c; }
        @media (prefers-color-scheme: dark) { :root { --acento: #f0a35e; --fondo: #14110e; --texto: #ece6dd; --suave: #b3a99b; } }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--fondo); color: var(--texto);
               font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 1rem; }
        h1 { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; letter-spacing: 0.18em; color: var(--acento); margin: 0 0 1rem; }
        p { color: var(--suave); max-width: 28rem; }
        a { display: inline-block; margin-top: 1rem; padding: 0.6rem 1.2rem; border-radius: 10px; background: var(--acento);
            color: var(--fondo); text-decoration: none; font-weight: 700; }
    </style>
</head>
<body>
    <main>
        <h1>OTIUM</h1>
        <p>Esta dirección no existe (puede ser un link viejo o mal copiado). Tus datos están bien: viven en tu navegador.</p>
        <a href="/otium/">Ir a OTIUM</a>
    </main>
</body>
</html>
